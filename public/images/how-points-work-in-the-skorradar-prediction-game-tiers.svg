<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="The three scoring tiers"><title>The three scoring tiers</title><rect x="1" y="1" width="1198" height="550" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">The three scoring tiers</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Points per prediction, highest tier only</text><rect x="40" y="130" width="800" height="72" rx="10" fill="#f5b700"/><text x="820" y="179" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0f172a" text-anchor="end">10</text><text x="860" y="177" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Exact score</text><rect x="40" y="230" width="400" height="72" rx="10" fill="#0b6e4f"/><text x="420" y="279" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#fff" text-anchor="end">5</text><text x="460" y="277" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Right result + goal difference</text><rect x="40" y="330" width="240" height="72" rx="10" fill="#64748b"/><text x="260" y="379" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#fff" text-anchor="end">3</text><text x="300" y="377" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Right result only</text><text x="40" y="436" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">Example: you pick 2-0.   2-0 = 10 points   3-1 = 5 points   1-0 = 3 points   1-1 = 0 points</text><text x="40" y="506" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">SkorRadar scoring: exact score 10, correct result and goal difference 5, correct result 3. Scored on the result</text><text x="40" y="532" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">after 90 minutes plus stoppage time.</text></svg>
