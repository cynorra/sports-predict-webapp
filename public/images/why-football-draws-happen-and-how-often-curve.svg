<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="Chance of a draw between equal teams"><title>Chance of a draw between equal teams</title><rect x="1" y="1" width="1198" height="670" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Chance of a draw between equal teams</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">More expected goals means fewer level finishes</text><line x1="150" x2="1090" y1="470" y2="470" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="478" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">10%</text><line x1="150" x2="1090" y1="395" y2="395" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="403" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">20%</text><line x1="150" x2="1090" y1="320" y2="320" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="328" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">30%</text><line x1="150" x2="1090" y1="244.99999999999997" y2="244.99999999999997" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="253" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">40%</text><line x1="150" x2="1090" y1="170" y2="170" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="178" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">50%</text><text x="150" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">0.5</text><text x="385" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.0</text><text x="620" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.5</text><text x="855" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">2.0</text><text x="1090" y="510" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">2.5</text><polyline points="150,195.7 173.5,213.9 197,230.2 220.5,244.7 244,257.7 267.5,269.4 291,280 314.5,289.6 338,298.3 361.5,306.3 385,313.6 408.5,320.3 432,326.5 455.5,332.2 479,337.5 502.5,342.5 526,347.1 549.5,351.4 573,355.4 596.5,359.2 620,362.7 643.5,366.1 667,369.3 690.5,372.3 714,375.2 737.5,377.9 761,380.5 784.5,383 808,385.3 831.5,387.6 855,389.7 878.5,391.8 902,393.8 925.5,395.7 949,397.6 972.5,399.4 996,401.1 1019.5,402.7 1043,404.3 1066.5,405.9 1090,407.3" fill="none" stroke="#0b6e4f" stroke-width="6" stroke-linejoin="round"/><circle cx="291" cy="280.0137517089911" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="307" y="262" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">35%</text><circle cx="526" cy="347.0645030930729" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="542" y="329.1" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">26%</text><circle cx="761" cy="380.49033165640753" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="777" y="362.5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">22%</text><text x="620" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">Expected goals for each team</text><text x="40" y="626" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Two equally matched teams, each expected to score the stated number of goals, with independent Poisson goals.</text><text x="40" y="652" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Computed, not observed data. Real leagues also show slightly more low-scoring draws than this simple model.</text></svg>
