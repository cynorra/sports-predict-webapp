<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 662" width="1200" height="662" role="img" aria-label="Home side's rating change after the match"><title>Home side's rating change after the match</title><rect x="1" y="1" width="1198" height="660" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Home side's rating change after the match</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Same teams, three results: an upset moves ratings far more than a routine win</text><line x1="60" x2="1140" y1="255" y2="255" stroke="#64748b" stroke-width="3"/><rect x="160" y="179.6911256633412" width="140" height="75.30887433665877" rx="6" fill="#0b6e4f"/><text x="230" y="165.7" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#0b6e4f" text-anchor="middle">+8</text><text x="230" y="535" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Home win</text><rect x="530" y="255" width="140" height="59.691125663341225" rx="6" fill="#d97706"/><text x="600" y="348.7" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#d97706" text-anchor="middle">−7</text><text x="600" y="535" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Draw</text><rect x="900" y="255" width="140" height="194.6911256633412" rx="6" fill="#b91c1c"/><text x="970" y="483.7" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#b91c1c" text-anchor="middle">−22</text><text x="970" y="535" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Home loss</text><text x="60" y="283" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">rating points</text><text x="40" y="616" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Home side rated 1900 against a visitor rated 1800, a 65-point home bonus and K = 30. Expected score 0.72, so the</text><text x="40" y="642" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">changes are 30 x (1 - 0.72), 30 x (0.5 - 0.72) and 30 x (0 - 0.72). The visitor moves by the opposite amounts.</text></svg>
