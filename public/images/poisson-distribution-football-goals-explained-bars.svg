<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 542" width="1200" height="542" role="img" aria-label="Chance of each goal count at 1.4 expected goals"><title>Chance of each goal count at 1.4 expected goals</title><rect x="1" y="1" width="1198" height="540" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Chance of each goal count at 1.4 expected goals</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">One goal is the most common outcome; a blank is almost as likely as two goals</text><line x1="80" x2="1120" y1="380" y2="380" stroke="#64748b" stroke-width="3"/><rect x="122" y="182.72242884671482" width="96" height="197.27757115328518" rx="6" fill="#0b6e4f"/><text x="170" y="168.7" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">24.7%</text><text x="170" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">0</text><rect x="272" y="103.8114003854007" width="96" height="276.1885996145993" rx="6" fill="#f5b700"/><text x="320" y="89.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">34.5%</text><text x="320" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">1</text><rect x="422" y="186.66798026978051" width="96" height="193.33201973021949" rx="6" fill="#0b6e4f"/><text x="470" y="172.7" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">24.2%</text><text x="470" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">2</text><rect x="572" y="289.77839079256427" width="96" height="90.22160920743575" rx="6" fill="#0b6e4f"/><text x="620" y="275.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">11.3%</text><text x="620" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">3</text><rect x="722" y="348.4224367773975" width="96" height="31.57756322260251" rx="6" fill="#0b6e4f"/><text x="770" y="334.4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">3.9%</text><text x="770" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">4</text><rect x="872" y="371.1582822976713" width="96" height="8.841717702328703" rx="6" fill="#0b6e4f"/><text x="920" y="357.2" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">1.1%</text><text x="920" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">5</text><rect x="1022" y="377.9369325361233" width="96" height="2.0630674638766973" rx="6" fill="#0b6e4f"/><text x="1070" y="363.9" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">0.3%</text><text x="1070" y="416" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#64748b" text-anchor="middle">6+</text><text x="600" y="454" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">Goals scored by the team</text><text x="40" y="496" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Poisson probabilities for a team expected to score 1.4 goals: P(k) = e^(-1.4) x 1.4^k / k!. Computed, not</text><text x="40" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">observed data. Six or more goals is shown as 6.</text></svg>
