<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-label="How a sending-off happens"><title>How a sending-off happens</title><rect x="1" y="1" width="1198" height="474" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How a sending-off happens</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Two cautions or one serious offence</text><rect x="40" y="150" width="340" height="190" rx="16" fill="#f5b700"/><rect x="170" y="172" width="80" height="108" rx="8" fill="#fff" fill-opacity=".22" stroke="#0f172a" stroke-width="3"/><text x="210" y="312" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Yellow card</text><text x="210" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#0f172a" text-anchor="middle">a caution</text><text x="410" y="255" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">+</text><rect x="440" y="150" width="340" height="190" rx="16" fill="#f5b700"/><rect x="570" y="172" width="80" height="108" rx="8" fill="#fff" fill-opacity=".22" stroke="#0f172a" stroke-width="3"/><text x="610" y="312" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Second yellow</text><text x="610" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#0f172a" text-anchor="middle">same match</text><text x="810" y="255" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">=</text><rect x="840" y="150" width="340" height="190" rx="16" fill="#b91c1c"/><rect x="970" y="172" width="80" height="108" rx="8" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="3"/><text x="1010" y="312" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Red card</text><text x="1010" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#fff" text-anchor="middle">sent off</text><text x="40" y="380" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">A direct red card for serious offences skips the yellow stage. The team plays on with one fewer player.</text><text x="40" y="456" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Based on Law 12 of the Laws of the Game (IFAB). Suspensions after a card are set by each competition.</text></svg>
