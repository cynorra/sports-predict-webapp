<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 402" width="1200" height="402" role="img" aria-label="How top-league matches usually end"><title>How top-league matches usually end</title><rect x="1" y="1" width="1198" height="400" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How top-league matches usually end</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Share of results across major European leagues, historically</text><rect x="40" y="140" width="504" height="100" fill="#0b6e4f" rx="10"/><text x="292" y="188" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Home win</text><text x="292" y="222" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#fff" text-anchor="middle">45%</text><rect x="544" y="140" width="280" height="100" fill="#64748b"/><text x="684" y="188" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Draw</text><text x="684" y="222" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#fff" text-anchor="middle">25%</text><rect x="824" y="140" width="336" height="100" fill="#f5b700"/><text x="992" y="188" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Away win</text><text x="992" y="222" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#0f172a" text-anchor="middle">30%</text><text x="40" y="288" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Typical goals per match: home side about 1.5, visitors about 1.2</text><text x="40" y="356" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Approximate long-run averages for the major European leagues. Exact figures vary by league and season; check a</text><text x="40" y="382" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">current sample (for example on FBref) before relying on them.</text></svg>
