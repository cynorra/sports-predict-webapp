<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-label="How a level knockout match is settled"><title>How a level knockout match is settled</title><rect x="1" y="1" width="1198" height="450" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How a level knockout match is settled</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Each step happens only if the previous one ends level</text><rect x="40" y="150" width="340" height="150" rx="16" fill="#0b6e4f"/><text x="210" y="212" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">90 minutes</text><text x="210" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle">plus stoppage time</text><path d="M390 225 H430" stroke="#0f172a" stroke-width="4" marker-end="none"/><path d="M418 211 L432 225 L418 239" fill="none" stroke="#0f172a" stroke-width="4"/><text x="410" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">level?</text><rect x="440" y="150" width="340" height="150" rx="16" fill="#d97706"/><text x="610" y="212" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">Extra time</text><text x="610" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle">2 x 15 minutes</text><path d="M790 225 H830" stroke="#0f172a" stroke-width="4" marker-end="none"/><path d="M818 211 L832 225 L818 239" fill="none" stroke="#0f172a" stroke-width="4"/><text x="810" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">level?</text><rect x="840" y="150" width="340" height="150" rx="16" fill="#f5b700"/><text x="1010" y="212" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="middle">Penalty shootout</text><text x="1010" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">5 kicks each, then sudden</text><text x="1010" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">death</text><text x="40" y="406" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Typical single-match knockout. Some competitions skip extra time, and two-leg ties apply the steps after the</text><text x="40" y="432" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">second leg. Check the regulations of the tournament.</text></svg>
