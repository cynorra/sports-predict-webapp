<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Where the offside line sits"><title>Where the offside line sits</title><rect x="1" y="1" width="1198" height="570" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Where the offside line sits</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Compare each attacker with the ball and the second-last opponent</text><rect x="60" y="130" width="1060" height="260" rx="10" fill="#eef7f2" stroke="#0b6e4f" stroke-width="3"/><line x1="1100" x2="1100" y1="130" y2="390" stroke="#0b6e4f" stroke-width="6"/><text x="1092" y="122" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="end">Goal line</text><line x1="820" x2="820" y1="112" y2="408" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 8"/><text x="820" y="436" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b91c1c" text-anchor="middle">Offside line: second-last defender</text><circle cx="1050" cy="260" r="24" fill="#0f172a" stroke="#0f172a" stroke-width="3"/><text x="1050" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">GK</text><circle cx="820" cy="200" r="24" fill="#0f172a" stroke="#0f172a" stroke-width="3"/><text x="820" y="208" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">D</text><circle cx="820" cy="330" r="24" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="820" y="338" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">A</text><circle cx="960" cy="190" r="24" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="960" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">B</text><circle cx="560" cy="270" r="14" fill="#fff" stroke="#0f172a" stroke-width="4"/><text x="560" y="312" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">Ball played</text><text x="820" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">Level = onside</text><text x="960" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">Ahead of the line</text><text x="40" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Simplified diagram, attacking left to right. Attacker A is level with the second-last defender (onside).</text><text x="40" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Attacker B is nearer the goal line than the ball and the second-last defender (offside position).</text></svg>
