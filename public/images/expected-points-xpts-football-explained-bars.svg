<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Expected points for one match"><title>Expected points for one match</title><rect x="1" y="1" width="1198" height="570" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Expected points for one match</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">An average over many identical matches, not a number anyone can score</text><text x="40" y="180" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Home side: expected points</text><rect x="420" y="140" width="428.1689259299117" height="56" rx="8" fill="#0b6e4f"/><text x="862.2" y="178" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">1.65</text><text x="40" y="270" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Away side: expected points</text><rect x="420" y="230" width="287.58124691698293" height="56" rx="8" fill="#f5b700"/><text x="721.6" y="268" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">1.11</text><text x="40" y="360" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Points that can actually be earned in one match:</text><rect x="40" y="384" width="170" height="64" rx="10" fill="#0b6e4f"/><text x="125" y="424" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Win: 3</text><rect x="240" y="384" width="170" height="64" rx="10" fill="#64748b"/><text x="325" y="424" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Draw: 1</text><rect x="440" y="384" width="170" height="64" rx="10" fill="#cbd5e1"/><text x="525" y="424" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Defeat: 0</text><text x="40" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Example match: expected goals 1.6 for the hosts and 1.2 for the visitors, independent Poisson goals. xPts = 3 x</text><text x="40" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">P(win) + 1 x P(draw).</text></svg>
