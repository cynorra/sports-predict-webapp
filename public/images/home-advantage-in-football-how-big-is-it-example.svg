<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 542" width="1200" height="542" role="img" aria-label="What a third of a goal changes"><title>What a third of a goal changes</title><rect x="1" y="1" width="1198" height="540" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">What a third of a goal changes</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Two evenly matched sides, with and without home advantage</text><text x="40" y="136" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Neutral pitch: 1.3 vs 1.3 expected goals</text><rect x="40" y="150" width="412.20816067400654" height="72" fill="#0b6e4f"/><text x="246.1" y="197" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">37%</text><rect x="452.20816067400654" y="150" width="295.5836753810111" height="72" fill="#64748b"/><text x="600" y="197" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">26%</text><rect x="747.7918360550177" y="150" width="412.20816067400654" height="72" fill="#f5b700"/><text x="953.9" y="197" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">37%</text><text x="40" y="276" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">With home bonus: 1.6 vs 1.2 expected goals</text><rect x="40" y="290" width="522.5505198857998" height="72" fill="#0b6e4f"/><text x="301.3" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">47%</text><rect x="562.5505198857998" y="290" width="276.7684289637588" height="72" fill="#64748b"/><text x="700.9" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">25%</text><rect x="839.3189488495586" y="290" width="320.6810320723636" height="72" fill="#f5b700"/><text x="999.7" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">29%</text><rect x="40" y="405" width="26" height="26" rx="4" fill="#0b6e4f"/><text x="76" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">Home win</text><rect x="230" y="405" width="26" height="26" rx="4" fill="#64748b"/><text x="266" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">Draw</text><rect x="420" y="405" width="26" height="26" rx="4" fill="#f5b700"/><text x="456" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">Away win</text><text x="40" y="496" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Independent Poisson goals, the same method as our model. Neutral pitch: 1.3 expected goals each. With the home</text><text x="40" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">bonus: hosts +0.3, visitors -0.1 (1.6 vs 1.2). Percentages are rounded and may not add to exactly 100.</text></svg>
