<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Chance of a clean sheet"><title>Chance of a clean sheet</title><rect x="1" y="1" width="1198" height="630" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Chance of a clean sheet</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Weaker attacks leave far more room for zero</text><line x1="150" x2="1090" y1="450" y2="450" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="458" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">10%</text><line x1="150" x2="1090" y1="390" y2="390" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="398" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">20%</text><line x1="150" x2="1090" y1="330" y2="330" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="338" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">30%</text><line x1="150" x2="1090" y1="270" y2="270" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">40%</text><line x1="150" x2="1090" y1="210" y2="210" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">50%</text><line x1="150" x2="1090" y1="150" y2="150" stroke="#e2e8f0" stroke-width="2"/><text x="130" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">60%</text><text x="150" y="488" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">0.5</text><text x="443.8" y="488" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.0</text><text x="737.5" y="488" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.5</text><text x="1031.3" y="488" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">2.0</text><polyline points="150,146.1 179.4,163.8 208.8,180.7 238.1,196.8 267.5,212 296.9,226.6 326.3,240.4 355.6,253.6 385,266.1 414.4,278 443.8,289.3 473.1,300 502.5,310.3 531.9,320 561.3,329.3 590.6,338.1 620,346.5 649.4,354.5 678.8,362 708.1,369.3 737.5,376.1 766.9,382.7 796.3,388.9 825.6,394.8 855,400.4 884.4,405.7 913.8,410.8 943.1,415.7 972.5,420.3 1001.9,424.6 1031.3,428.8" fill="none" stroke="#0b6e4f" stroke-width="6" stroke-linejoin="round"/><circle cx="326.25" cy="240.40262152966704" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="342.3" y="224.4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">45%</text><circle cx="561.25" cy="329.28347285267876" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="577.3" y="313.3" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">30%</text><circle cx="1031.25" cy="428.79883005803237" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="1047.3" y="412.8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">14%</text><text x="620" y="530" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">Opponent's expected goals</text><text x="40" y="586" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Chance that the opponent scores zero = e^(-m), where m is the opponent's expected goals (Poisson). Computed, not</text><text x="40" y="612" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">observed data.</text></svg>
