<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Two ways to order the tiebreakers"><title>Two ways to order the tiebreakers</title><rect x="1" y="1" width="1198" height="590" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Two ways to order the tiebreakers</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Same measures, different order, sometimes a different table</text><rect x="40" y="130" width="540" height="64" rx="12" fill="#0b6e4f"/><text x="310" y="160" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Overall record first</text><text x="310" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#fff" text-anchor="middle">Premier League and Bundesliga style</text><rect x="40" y="214" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="74" cy="241" r="16" fill="#0b6e4f"/><text x="74" y="248" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="249" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Points</text><rect x="40" y="280" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="74" cy="307" r="16" fill="#0b6e4f"/><text x="74" y="314" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Goal difference</text><rect x="40" y="346" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="74" cy="373" r="16" fill="#0b6e4f"/><text x="74" y="380" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="381" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Goals scored</text><rect x="40" y="412" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="74" cy="439" r="16" fill="#0b6e4f"/><text x="74" y="446" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="447" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Head-to-head record</text><rect x="610" y="130" width="540" height="64" rx="12" fill="#f5b700"/><text x="880" y="160" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Head-to-head first</text><text x="880" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#0f172a" text-anchor="middle">La Liga style</text><rect x="610" y="214" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="644" cy="241" r="16" fill="#f5b700"/><text x="644" y="248" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">1</text><text x="676" y="249" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Points</text><rect x="610" y="280" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="644" cy="307" r="16" fill="#f5b700"/><text x="644" y="314" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">2</text><text x="676" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Head-to-head points</text><rect x="610" y="346" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="644" cy="373" r="16" fill="#f5b700"/><text x="644" y="380" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">3</text><text x="676" y="381" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Head-to-head goal difference</text><rect x="610" y="412" width="540" height="54" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><circle cx="644" cy="439" r="16" fill="#f5b700"/><text x="644" y="446" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">4</text><text x="676" y="447" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">Overall goal difference</text><text x="40" y="546" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Simplified. Each competition publishes the complete list, which continues beyond these steps, and it can change</text><text x="40" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">between seasons. Read the current regulations.</text></svg>
