<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-label="Same match, two stories"><title>Same match, two stories</title><rect x="1" y="1" width="1198" height="470" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Same match, two stories</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Chances created (xG) against the final result</text><text x="40" y="172" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Winning side</text><text x="40" y="202" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">8 shots, scored 1</text><rect x="300" y="140" width="360" height="76" rx="8" fill="#f5b700"/><text x="642" y="190" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="end">0.9 xG</text><text x="40" y="282" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Losing side</text><text x="40" y="312" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">15 shots, scored 0</text><rect x="300" y="250" width="840" height="76" rx="8" fill="#0b6e4f"/><text x="1122" y="300" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="end">2.1 xG</text><text x="40" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Worked example from this article: a 1-0 result. Winners 8 shots worth 0.9 xG in total; losers 15 shots worth 2.1</text><text x="40" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">xG in total.</text></svg>
