<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="What both rating systems have in common"><title>What both rating systems have in common</title><rect x="1" y="1" width="1198" height="570" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">What both rating systems have in common</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Points move after every match, depending on what was expected</text><text x="560" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b6e4f" text-anchor="middle">FIFA ranking</text><text x="910" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#b45309" text-anchor="middle">Independent Elo ratings</text><rect x="40" y="160" width="1120" height="60" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="64" y="199" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Result of the match</text><text x="560" y="199" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><text x="910" y="199" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><rect x="40" y="234" width="1120" height="60" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="64" y="273" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Importance of the match</text><text x="560" y="273" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><text x="910" y="273" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><rect x="40" y="308" width="1120" height="60" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="64" y="347" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Strength of the opponent</text><text x="560" y="347" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><text x="910" y="347" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Yes</text><rect x="40" y="382" width="1120" height="60" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="64" y="421" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Goal margin</text><text x="560" y="421" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Handled differently</text><text x="910" y="421" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">Often scales the change</text><text x="40" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Simplified comparison of the shared structure. The exact formulas, weights and treatment of goal margins are set</text><text x="40" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">by FIFA and by each independent Elo site; check their documentation.</text></svg>
