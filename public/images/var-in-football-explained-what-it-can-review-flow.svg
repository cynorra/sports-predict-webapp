<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-label="How a video review runs"><title>How a video review runs</title><rect x="1" y="1" width="1198" height="564" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How a video review runs</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">The assistant advises; the referee decides</text><rect x="40" y="124" width="260" height="52" rx="26" fill="#f5b700"/><text x="170" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Goals</text><rect x="320" y="124" width="260" height="52" rx="26" fill="#f5b700"/><text x="450" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Penalties</text><rect x="600" y="124" width="260" height="52" rx="26" fill="#f5b700"/><text x="730" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Direct red cards</text><rect x="880" y="124" width="260" height="52" rx="26" fill="#f5b700"/><text x="1010" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Mistaken identity</text><rect x="40" y="240" width="340" height="140" rx="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="210" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">VAR checks</text><text x="210" y="338" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">silently, in the background</text><path d="M390 310 H430" stroke="#0f172a" stroke-width="4"/><path d="M418 296 L432 310 L418 324" fill="none" stroke="#0f172a" stroke-width="4"/><rect x="440" y="240" width="340" height="140" rx="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="610" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Possible clear error?</text><text x="610" y="338" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="middle">recommends a review</text><path d="M790 310 H830" stroke="#0f172a" stroke-width="4"/><path d="M818 296 L832 310 L818 324" fill="none" stroke="#0f172a" stroke-width="4"/><rect x="840" y="240" width="340" height="140" rx="16" fill="#0b6e4f" stroke="#e2e8f0" stroke-width="2"/><text x="1010" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Referee decides</text><text x="1010" y="338" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#fff" text-anchor="middle">by signal or on-field review</text><text x="40" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="start">Only these four situations can be reviewed</text><text x="40" y="546" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Simplified from the IFAB video assistant referee protocol. The on-field referee always makes the final decision.</text></svg>
