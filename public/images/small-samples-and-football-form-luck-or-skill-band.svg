<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" role="img" aria-label="How far a goal average can drift by chance"><title>How far a goal average can drift by chance</title><rect x="1" y="1" width="1198" height="500" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How far a goal average can drift by chance</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">The more matches, the narrower the typical swing</text><line x1="140" x2="140" y1="130" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="140" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">0.5</text><line x1="380" x2="380" y1="130" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="380" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.0</text><line x1="620" x2="620" y1="130" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="620" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">1.5</text><line x1="860" x2="860" y1="130" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="860" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">2.0</text><line x1="1100" x2="1100" y1="130" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="1100" y="392" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">2.5</text><line x1="572" x2="572" y1="136" y2="360" stroke="#0f172a" stroke-width="3" stroke-dasharray="8 8"/><text x="572" y="130" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">True rate 1.4</text><rect x="318.00787413779926" y="160" width="507.98425172440136" height="46" rx="8" fill="#0b6e4f"/><text x="24" y="191" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">5 matches</text><text x="840" y="191" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">0.9 to 1.9</text><rect x="392.40044543485084" y="226" width="359.19910913029827" height="46" rx="8" fill="#d97706"/><text x="24" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">10 matches</text><text x="765.6" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">1.0 to 1.8</text><rect x="479.86737248601014" y="292" width="184.2652550279796" height="46" rx="8" fill="#64748b"/><text x="24" y="323" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">38 matches</text><text x="678.1" y="323" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="start">1.2 to 1.6</text><text x="40" y="456" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">One standard error of a goal average for a team whose true rate is 1.4 goals per match: the square root of (1.4</text><text x="40" y="482" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">/ matches). Computed from the Poisson distribution, not observed data.</text></svg>
