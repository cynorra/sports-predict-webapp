<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="How 48 teams become one champion"><title>How 48 teams become one champion</title><rect x="1" y="1" width="1198" height="610" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How 48 teams become one champion</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Teams remaining at the start of each stage</text><rect x="40" y="124" width="800" height="42" rx="8" fill="#084c38"/><text x="56" y="153" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Group stage</text><text x="856" y="154" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">48 teams</text><rect x="40" y="180" width="546.6666666666666" height="42" rx="8" fill="#0b6e4f"/><text x="56" y="209" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Round of 32</text><text x="602.7" y="210" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">32 teams</text><rect x="40" y="236" width="293.3333333333333" height="42" rx="8" fill="#0b6e4f"/><text x="56" y="265" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Round of 16</text><text x="349.3" y="266" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">16 teams</text><rect x="40" y="292" width="166.66666666666666" height="42" rx="8" fill="#0b6e4f"/><text x="56" y="321" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Quarter-finals</text><text x="222.7" y="322" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">8 teams</text><rect x="40" y="348" width="103.33333333333333" height="42" rx="8" fill="#0b6e4f"/><text x="56" y="377" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Semi-finals</text><text x="159.3" y="378" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">4 teams</text><rect x="40" y="404" width="71.66666666666666" height="42" rx="8" fill="#0b6e4f"/><text x="56" y="433" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">Final</text><text x="127.7" y="434" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">2 teams</text><rect x="40" y="460" width="55.83333333333333" height="42" rx="8" fill="#f5b700"/><text x="56" y="489" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Champion</text><text x="111.8" y="490" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">1 team</text><text x="40" y="566" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Format of the 48-team men's World Cup as set out in the FIFA regulations: 12 groups of four, the top two plus</text><text x="40" y="592" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">the eight best third-placed teams advance.</text></svg>
