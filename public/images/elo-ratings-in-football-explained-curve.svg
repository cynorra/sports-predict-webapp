<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img" aria-label="Elo: expected score by rating gap"><title>Elo: expected score by rating gap</title><rect x="1" y="1" width="1198" height="710" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Elo: expected score by rating gap</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">The bigger the gap, the more the stronger team is expected to score</text><line x1="130" x2="1130" y1="520" y2="520" stroke="#e2e8f0" stroke-width="2"/><text x="110" y="528" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">0%</text><line x1="130" x2="1130" y1="425" y2="425" stroke="#e2e8f0" stroke-width="2"/><text x="110" y="433" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">25%</text><line x1="130" x2="1130" y1="330" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="8 8"/><text x="110" y="338" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">50%</text><line x1="130" x2="1130" y1="235" y2="235" stroke="#e2e8f0" stroke-width="2"/><text x="110" y="243" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">75%</text><line x1="130" x2="1130" y1="140" y2="140" stroke="#e2e8f0" stroke-width="2"/><text x="110" y="148" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="end">100%</text><text x="130" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">-400</text><text x="380" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">-200</text><text x="630" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">0</text><text x="880" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">+200</text><text x="1130" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">+400</text><polyline points="130,485.5 142.5,483.6 155,481.7 167.5,479.6 180,477.5 192.5,475.3 205,473 217.5,470.5 230,468 242.5,465.4 255,462.6 267.5,459.8 280,456.8 292.5,453.7 305,450.5 317.5,447.2 330,443.7 342.5,440.1 355,436.4 367.5,432.6 380,428.7 392.5,424.7 405,420.5 417.5,416.2 430,411.8 442.5,407.3 455,402.7 467.5,398 480,393.1 492.5,388.2 505,383.2 517.5,378.1 530,373 542.5,367.8 555,362.5 567.5,357.2 580,351.8 592.5,346.4 605,340.9 617.5,335.5 630,330 642.5,324.5 655,319.1 667.5,313.6 680,308.2 692.5,302.8 705,297.5 717.5,292.2 730,287 742.5,281.9 755,276.8 767.5,271.8 780,266.9 792.5,262 805,257.3 817.5,252.7 830,248.2 842.5,243.8 855,239.5 867.5,235.3 880,231.3 892.5,227.4 905,223.6 917.5,219.9 930,216.3 942.5,212.8 955,209.5 967.5,206.3 980,203.2 992.5,200.2 1005,197.4 1017.5,194.6 1030,192 1042.5,189.5 1055,187 1067.5,184.7 1080,182.5 1092.5,180.4 1105,178.3 1117.5,176.4 1130,174.5" fill="none" stroke="#0b6e4f" stroke-width="6" stroke-linejoin="round"/><line x1="630" x2="630" y1="330" y2="520" stroke="#f5b700" stroke-width="2" stroke-dasharray="4 6"/><circle cx="630" cy="330" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="648" y="370" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Equal ratings: 50%</text><line x1="755" x2="755" y1="276.77530007490367" y2="520" stroke="#f5b700" stroke-width="2" stroke-dasharray="4 6"/><circle cx="755" cy="276.77530007490367" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="773" y="316.8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">+100 points: 64%</text><line x1="880" x2="880" y1="231.29616787377603" y2="520" stroke="#f5b700" stroke-width="2" stroke-dasharray="4 6"/><circle cx="880" cy="231.29616787377603" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="898" y="271.3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">+200 points: 76%</text><line x1="1130" x2="1130" y1="174.54545454545456" y2="520" stroke="#f5b700" stroke-width="2" stroke-dasharray="4 6"/><circle cx="1130" cy="174.54545454545456" r="11" fill="#f5b700" stroke="#0f172a" stroke-width="3"/><text x="1140" y="146.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="end">+400 points: 91%</text><text x="630" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#0f172a" text-anchor="middle">Rating gap (team's rating minus opponent's rating)</text><text x="40" y="666" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Expected score counts a win as 1, a draw as 0.5 and a loss as 0, so it is not a win probability. Computed from</text><text x="40" y="692" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">the standard Elo formula E = 1 / (1 + 10^(-gap / 400)).</text></svg>
