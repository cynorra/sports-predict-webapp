<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="How the eight opponents are drawn"><title>How the eight opponents are drawn</title><rect x="1" y="1" width="1198" height="630" rx="18" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">How the eight opponents are drawn</text><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#64748b" text-anchor="start">Pots are based on UEFA club coefficients</text><circle cx="190" cy="330" r="96" fill="#f5b700" stroke="#0f172a" stroke-width="4"/><text x="190" y="328" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">One club</text><text x="190" y="360" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="middle">8 matches</text><line x1="286" y1="330" x2="540" y2="159" stroke="#64748b" stroke-width="2.5"/><rect x="540" y="125" width="620" height="68" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="566" y="168" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Pot 1</text><text x="676" y="168" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="start">9 clubs</text><text x="1136" y="168" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b6e4f" text-anchor="end">1 at home + 1 away</text><line x1="286" y1="330" x2="540" y2="251" stroke="#64748b" stroke-width="2.5"/><rect x="540" y="217" width="620" height="68" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="566" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Pot 2</text><text x="676" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="start">9 clubs</text><text x="1136" y="260" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b6e4f" text-anchor="end">1 at home + 1 away</text><line x1="286" y1="330" x2="540" y2="343" stroke="#64748b" stroke-width="2.5"/><rect x="540" y="309" width="620" height="68" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="566" y="352" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Pot 3</text><text x="676" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="start">9 clubs</text><text x="1136" y="352" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b6e4f" text-anchor="end">1 at home + 1 away</text><line x1="286" y1="330" x2="540" y2="435" stroke="#64748b" stroke-width="2.5"/><rect x="540" y="401" width="620" height="68" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/><text x="566" y="444" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Pot 4</text><text x="676" y="444" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="start">9 clubs</text><text x="1136" y="444" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b6e4f" text-anchor="end">1 at home + 1 away</text><text x="1160" y="523" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="end">4 pots x 2 opponents = 8 matches: 4 at home, 4 away</text><text x="40" y="586" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Clubs from the same national association cannot meet in the league phase. The draw decides which two clubs from</text><text x="40" y="612" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">each pot you face.</text></svg>
