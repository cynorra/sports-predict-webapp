# Keeps src/data/fixtures.json and src/data/results.json fresh. Fixtures and the Elo ratings behind /predict go stale within days, so this runs
# three times a day and commits ONLY when the data actually changed. The host redeploys on push.
#
# Security model
#  - The football-data.org token exists only as the repository secret FOOTBALL_DATA_TOKEN and is handed to ONE step.
#  - The scripts use only Node built-ins, so this workflow installs no npm packages (no supply-chain surface).
#  - Actions are pinned to commit SHAs; the workflow token is limited to contents:write for this job only.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository secret: FOOTBALL_DATA_TOKEN.
# Optional secret SPORTAPI_KEY (sportapi.ai) feeds the /results page.
# Optional secret FIREBASE_SERVICE_ACCOUNT (full service-account JSON) mirrors fixtures to Firestore for the prediction lock.
# Deploys go through deploy.yml (Cloudflare Pages direct upload): secret CLOUDFLARE_API_TOKEN + variables CLOUDFLARE_ACCOUNT_ID, SITE_URL.
name: refresh-data
on:
  schedule:
    - cron: '23 4,12,18 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    # Guard against forks/mirrors running this with the wrong secrets. Replace cynorra/sports-predict-webapp with the real repository.
    if: github.repository == 'cynorra/sports-predict-webapp' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Past seasons never change, so cache the raw API responses; only the current season is re-downloaded.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: scripts/.cache
          key: fd-cache-${{ github.run_id }}
          restore-keys: fd-cache-

      - name: Self-test the gates and scan for leaked secrets
        run: |
          node --test scripts/lib/*.test.mjs
          node scripts/check-secrets.mjs

      - name: Sync fixtures and ratings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-fixtures.mjs

      # Finished matches for /results. The SportAPI key is handed to this one step only. Skipped quietly if the secret is unset;
      # a failed or rate-limited call leaves the existing file untouched, so it must never fail the whole refresh.
      - name: Sync results
        continue-on-error: true
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: node scripts/sync-results.mjs

      # Scheduled matches for /soccer-games-today. Same key, same rules: skipped without the secret, never fails the refresh.
      - name: Sync upcoming matches
        continue-on-error: true
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: node scripts/sync-upcoming.mjs

      # Server-trusted copy of the fixtures so Firestore rules can lock predictions at the real kickoff.
      # The service account (full admin access to Firestore) is handed to this one step only. Skipped if the secret is unset.
      - name: Mirror fixtures to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/push-fixtures.mjs

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- src/data/fixtures.json src/data/results.json src/data/upcoming.json && [ -z "$(git ls-files --others --exclude-standard src/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "data unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fixtures.json src/data/results.json src/data/upcoming.json
          git commit -m "data: refresh fixtures, ratings, results and schedule"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Bot commits made with GITHUB_TOKEN do not trigger the push workflow, so a changed-data run calls the deploy workflow directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
