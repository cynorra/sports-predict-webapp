# Rebuilds the site when a scheduled post has just gone live. Posts are static, so a post dated in the past only
# appears after the next build. Runs hourly Mon-Fri inside the publishing window (09:00-17:00 US Eastern = 13:00-22:00
# UTC across daylight saving) and triggers the host's deploy hook ONLY if the schedule script says something is due.
# (every automation step has its own "nothing to do today" guard; cron is limited to weekdays.)
#
# Setup: add the repository secret DEPLOY_HOOK_URL (Vercel / Netlify / Cloudflare Pages deploy hook).
# No npm install: the scripts used here need only Node built-ins. Actions are pinned to commit SHAs.
name: publish-scheduled
on:
  schedule:
    - cron: '5 13-22 * * 1-5'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  check:
    # Guard against mirrors/forks triggering the same deploy. Replace cynorra/sports-predict-webapp with the real repository.
    if: github.repository == 'cynorra/sports-predict-webapp' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The quality gates are the only thing between a bad draft and the live site; fail loudly if a refactor broke one.
      - name: Quality gate self-test, secret scan and content audit
        run: |
          node --test scripts/lib/*.test.mjs
          node scripts/check-secrets.mjs
          node scripts/audit-content.mjs
      - id: due
        run: |
          if node scripts/schedule-posts.mjs --due; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi
      - name: Trigger deploy
        if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
