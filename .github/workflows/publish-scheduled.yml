# Rebuilds the site when a scheduled post has just gone live. Posts are static, so a post dated in the past only
# appears after the next build. Runs hourly Mon-Fri inside the publishing window (09:00-17:00 US Eastern = 13:00-22:00
# UTC across daylight saving) and calls deploy.yml (Cloudflare Pages) ONLY if the schedule script says something is due.
# (every automation step has its own "nothing to do today" guard; cron is limited to weekdays.)
#
# Setup: repository secret CLOUDFLARE_API_TOKEN and variables CLOUDFLARE_ACCOUNT_ID, SITE_URL (see deploy.yml).
# No npm install: the scripts used here need only Node built-ins. Actions are pinned to commit SHAs.
name: publish-scheduled
on:
  schedule:
    - cron: '5 13-22 * * 1-5'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  check:
    # Guard against mirrors/forks triggering the same deploy. Replace cynorra/sports-predict-webapp with the real repository.
    if: github.repository == 'cynorra/sports-predict-webapp' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.due.outputs.due }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The quality gates are the only thing between a bad draft and the live site; fail loudly if a refactor broke one.
      - name: Quality gate self-test, secret scan and content audit
        run: |
          node --test scripts/lib/*.test.mjs
          node scripts/check-secrets.mjs
          node scripts/audit-content.mjs
      - id: due
        run: |
          if node scripts/schedule-posts.mjs --due; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Tell IndexNow search engines (Bing, Yandex and others) about the post that just went live, once the deploy finished.
  # Needs the repository variable SITE_URL. A failure here must never fail the run, hence continue-on-error.
  notify:
    needs: [check, deploy]
    if: needs.check.outputs.due == 'true' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Notify IndexNow
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sleep 60
          node scripts/indexnow.mjs --since-hours 3
