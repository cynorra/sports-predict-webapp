# Builds the site and publishes it to Cloudflare Pages (project todays-soccer-games, https://todayssoccergames.com).
# Called by refresh-data and publish-scheduled (their bot commits do not trigger push workflows), and also runs on a push to main.
#
# Security model
#  - Two jobs. "build" installs npm packages and runs the build with NO secrets, so a compromised dependency finds nothing to steal.
#  - "deploy" gets the Cloudflare token (a single step) but runs no project code: it only uploads the finished files with a pinned wrangler.
#  - Actions are pinned to commit SHAs; the workflow token is read-only.
#
# Setup: repository secret CLOUDFLARE_API_TOKEN (Pages: Edit); repository variables CLOUDFLARE_ACCOUNT_ID, SITE_URL and the
# public PUBLIC_FIREBASE_* web config (public by design; Firestore is protected by firestore.rules).
name: deploy
on:
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # Guard against forks/mirrors. Replace cynorra/sports-predict-webapp with the real repository.
    if: github.repository == 'cynorra/sports-predict-webapp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # ref: main so a run called right after a bot data commit builds that commit, not the older one the caller started on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm run build = tests -> secret scan -> content audit -> astro build; a failing post blocks the deploy.
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist/client
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy site --project-name todays-soccer-games --branch main --commit-dirty=true
