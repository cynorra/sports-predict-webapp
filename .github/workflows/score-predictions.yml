# Scores finished matches and rebuilds the public leaderboard in Firestore. Points are computed ONLY here, with the
# service account, never in the browser (so the leaderboard cannot be tampered with from a client).
# Runs every 3 hours; it does nothing when no match has finished. No npm install (Node built-ins only), actions pinned to SHAs.
#
# Secrets used (only by the scoring step): FOOTBALL_DATA_TOKEN, FIREBASE_SERVICE_ACCOUNT.
name: score-predictions
on:
  schedule:
    - cron: '10 */3 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: score-predictions
  cancel-in-progress: false

jobs:
  score:
    if: github.repository == 'cynorra/sports-predict-webapp' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Self-test and secret scan
        run: |
          node --test scripts/lib/*.test.mjs
          node scripts/check-secrets.mjs
      - name: Score matches and update leaderboard
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/score-predictions.mjs
